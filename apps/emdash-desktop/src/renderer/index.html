<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ninebrains</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('emdash-theme');
          var pref = raw ? JSON.parse(raw) : null;
          var effective =
            pref === 'emlight' || pref === 'emdark' || pref === 'emhardstyle'
              ? pref
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'emdark'
                : 'emlight';
          document.documentElement.classList.add(effective);
          // sRGB approximations of the theme --background / --foreground
          // tokens, applied before any stylesheet loads so the very first
          // paint (and the boot splash) match the persisted theme. Hardstyle
          // is dark-polarity too, so it shares the dark boot-splash colors;
          // its neon accent only shows up once the real stylesheet loads.
          var dark = effective === 'emdark' || effective === 'emhardstyle';
          var style = document.documentElement.style;
          style.backgroundColor = dark ? '#111111' : '#fcfcfc';
          style.setProperty('--boot-splash-bg', dark ? '#111111' : '#fcfcfc');
          style.setProperty('--boot-splash-fg', dark ? '#eeeeee' : '#202020');
        } catch (_) {}
      })();
    </script>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background-color: var(--boot-splash-bg, #fcfcfc);
        color: var(--boot-splash-fg, #202020);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        user-select: none;
        cursor: default;
        opacity: 1;
        transition: opacity 180ms ease-out;
        -webkit-app-region: drag;
      }
      #boot-splash.boot-splash-done {
        opacity: 0;
        pointer-events: none;
      }
      /*
        The website's loading mark (apps/site/src/index.html #intro): the nine-square brand mark,
        centred and sized the same. Geometry is shared with WorkingMarkIcon and
        tooling/brand/glyph.mjs. If boot runs long, the arms start the same clockwise sweep
        WorkingMarkIcon uses, so a slow start still reads as alive rather than frozen.
      */
      #boot-splash .boot-splash-mark {
        display: block;
        width: clamp(96px, 12vmin, 120px);
        height: auto;
        fill: var(--boot-splash-fg, #202020);
      }
      #boot-splash .boot-splash-mark rect {
        animation: boot-splash-arm 1.6s linear infinite;
        animation-delay: calc(1.2s + var(--i) * 0.2s);
        animation-fill-mode: backwards;
      }
      #boot-splash .boot-splash-mark .boot-splash-core {
        animation: boot-splash-core 0.8s ease-in-out 1.2s infinite;
        animation-fill-mode: backwards;
      }
      #boot-splash-escape {
        position: absolute;
        bottom: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        color: color-mix(in srgb, var(--boot-splash-fg, #202020) 72%, transparent);
      }
      #boot-splash-escape[hidden] {
        display: none;
      }
      #boot-splash-escape p {
        margin: 0;
      }
      .boot-splash-escape-actions {
        display: flex;
        gap: 8px;
      }
      .boot-splash-escape-actions button {
        -webkit-app-region: no-drag;
        appearance: none;
        font: inherit;
        font-size: 12px;
        color: var(--boot-splash-fg, #202020);
        background: transparent;
        border: 1px solid color-mix(in srgb, var(--boot-splash-fg, #202020) 30%, transparent);
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .boot-splash-escape-actions button:hover {
        background-color: color-mix(in srgb, var(--boot-splash-fg, #202020) 8%, transparent);
      }
      /* Same fade curve as WorkingMarkIcon: a bright head with a soft tail, never fully gone. */
      @keyframes boot-splash-arm {
        0% {
          opacity: 1;
        }
        25% {
          opacity: 0.55;
        }
        50% {
          opacity: 0.25;
        }
        75% {
          opacity: 0.12;
        }
        100% {
          opacity: 0.08;
        }
      }
      @keyframes boot-splash-core {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-splash-mark rect,
        #boot-splash .boot-splash-mark .boot-splash-core {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <svg class="boot-splash-mark" viewBox="0 0 70 70" aria-hidden="true" focusable="false">
        <!-- Arms clockwise from the top; --i staggers the sweep so it traces a lap. -->
        <rect style="--i: 0" x="28.5" y="7.5" width="13" height="13" rx="2" />
        <rect style="--i: 1" x="49.5" y="7.5" width="13" height="13" rx="2" />
        <rect style="--i: 2" x="49.5" y="28.5" width="13" height="13" rx="2" />
        <rect style="--i: 3" x="49.5" y="49.5" width="13" height="13" rx="2" />
        <rect style="--i: 4" x="28.5" y="49.5" width="13" height="13" rx="2" />
        <rect style="--i: 5" x="7.5" y="49.5" width="13" height="13" rx="2" />
        <rect style="--i: 6" x="7.5" y="28.5" width="13" height="13" rx="2" />
        <rect style="--i: 7" x="7.5" y="7.5" width="13" height="13" rx="2" />
        <rect class="boot-splash-core" x="25" y="25" width="20" height="20" rx="2" />
      </svg>
      <div id="boot-splash-escape" hidden>
        <p>Ninebrains is taking longer than expected to start.</p>
        <div class="boot-splash-escape-actions">
          <button id="boot-splash-restart" type="button">Restart Ninebrains</button>
          <button id="boot-splash-recovery" type="button">Open recovery</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
