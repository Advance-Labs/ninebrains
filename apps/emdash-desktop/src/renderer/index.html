<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ninebrains</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('emdash-theme');
          var pref = raw ? JSON.parse(raw) : null;
          var effective =
            pref === 'emlight' || pref === 'emdark' || pref === 'emhardstyle'
              ? pref
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'emdark'
                : 'emlight';
          document.documentElement.classList.add(effective);
          // sRGB approximations of the theme --background / --foreground
          // tokens, applied before any stylesheet loads so the very first
          // paint (and the boot splash) match the persisted theme. Hardstyle
          // is dark-polarity too, so it shares the dark boot-splash colors;
          // its neon accent only shows up once the real stylesheet loads.
          var dark = effective === 'emdark' || effective === 'emhardstyle';
          var style = document.documentElement.style;
          style.backgroundColor = dark ? '#111111' : '#fcfcfc';
          style.setProperty('--boot-splash-bg', dark ? '#111111' : '#fcfcfc');
          style.setProperty('--boot-splash-fg', dark ? '#eeeeee' : '#202020');
        } catch (_) {}
      })();
    </script>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background-color: var(--boot-splash-bg, #fcfcfc);
        color: var(--boot-splash-fg, #202020);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        user-select: none;
        cursor: default;
        opacity: 1;
        transition: opacity 180ms ease-out;
        -webkit-app-region: drag;
      }
      #boot-splash.boot-splash-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-splash-logo {
        height: 26px;
        width: auto;
        fill: var(--boot-splash-fg, #202020);
        stroke: var(--boot-splash-fg, #202020);
        opacity: 0.9;
      }
      #boot-splash .boot-splash-progress {
        position: relative;
        width: 132px;
        height: 2px;
        border-radius: 1px;
        overflow: hidden;
        background-color: color-mix(in srgb, var(--boot-splash-fg, #202020) 14%, transparent);
        opacity: 0;
        animation: boot-splash-reveal 240ms ease-out 1200ms forwards;
      }
      #boot-splash .boot-splash-progress::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: 1px;
        background-color: color-mix(in srgb, var(--boot-splash-fg, #202020) 55%, transparent);
        animation: boot-splash-slide 1.3s ease-in-out infinite;
      }
      #boot-splash-escape {
        position: absolute;
        bottom: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        color: color-mix(in srgb, var(--boot-splash-fg, #202020) 72%, transparent);
      }
      #boot-splash-escape[hidden] {
        display: none;
      }
      #boot-splash-escape p {
        margin: 0;
      }
      .boot-splash-escape-actions {
        display: flex;
        gap: 8px;
      }
      .boot-splash-escape-actions button {
        -webkit-app-region: no-drag;
        appearance: none;
        font: inherit;
        font-size: 12px;
        color: var(--boot-splash-fg, #202020);
        background: transparent;
        border: 1px solid color-mix(in srgb, var(--boot-splash-fg, #202020) 30%, transparent);
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .boot-splash-escape-actions button:hover {
        background-color: color-mix(in srgb, var(--boot-splash-fg, #202020) 8%, transparent);
      }
      @keyframes boot-splash-reveal {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-splash-slide {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-splash-progress {
          animation-duration: 1ms;
        }
        #boot-splash .boot-splash-progress::before {
          animation: none;
          left: 30%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <svg class="boot-splash-logo" viewBox="0 0 350 70" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke-width="3" stroke-linecap="round">
          <path transform="rotate(0 35 35)" d="M 35 25 C 41.2 17.5, 29.2 11.5, 36.4 5" />
          <path transform="rotate(45 35 35)" d="M 35 25 C 41.2 17.5, 29.2 11.5, 36.4 5" />
          <path transform="rotate(90 35 35)" d="M 35 25 C 41.2 17.5, 29.2 11.5, 36.4 5" />
          <path transform="rotate(135 35 35)" d="M 35 25 C 41.2 17.5, 29.2 11.5, 36.4 5" />
          <path transform="rotate(180 35 35)" d="M 35 25 C 41.2 17.5, 29.2 11.5, 36.4 5" />
          <path transform="rotate(225 35 35)" d="M 35 25 C 41.2 17.5, 29.2 11.5, 36.4 5" />
          <path transform="rotate(270 35 35)" d="M 35 25 C 41.2 17.5, 29.2 11.5, 36.4 5" />
          <path transform="rotate(315 35 35)" d="M 35 25 C 41.2 17.5, 29.2 11.5, 36.4 5" />
        </g>
        <g stroke-width="0">
          <circle transform="rotate(0 35 35)" cx="36.4" cy="5" r="3.4" />
          <circle transform="rotate(45 35 35)" cx="36.4" cy="5" r="3.4" />
          <circle transform="rotate(90 35 35)" cx="36.4" cy="5" r="3.4" />
          <circle transform="rotate(135 35 35)" cx="36.4" cy="5" r="3.4" />
          <circle transform="rotate(180 35 35)" cx="36.4" cy="5" r="3.4" />
          <circle transform="rotate(225 35 35)" cx="36.4" cy="5" r="3.4" />
          <circle transform="rotate(270 35 35)" cx="36.4" cy="5" r="3.4" />
          <circle transform="rotate(315 35 35)" cx="36.4" cy="5" r="3.4" />
          <circle cx="35" cy="35" r="11.8" />
          <text x="82" y="51" font-size="46" font-weight="600" letter-spacing="-1">ninebrains</text>
        </g>
      </svg>
      <div class="boot-splash-progress"></div>
      <div id="boot-splash-escape" hidden>
        <p>Ninebrains is taking longer than expected to start.</p>
        <div class="boot-splash-escape-actions">
          <button id="boot-splash-restart" type="button">Restart Ninebrains</button>
          <button id="boot-splash-recovery" type="button">Open recovery</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
