name: Setup build environment
description: Install toolchain, deps, and write production env

# Ninebrains: the PostHog key/host inputs are removed. No telemetry key is ever written into a
# build (see docs/UPSTREAM-PATCHES.md).
inputs:
  build-variant:
    description: Build variant to embed (canary | prod)
    required: false
    default: 'prod'
  windows-native:
    description: Set to true on Windows to pass MSVC/gyp flags to pnpm install
    required: false
    default: 'false'
  setup-python:
    description: Set to false when the job image already provides a compatible Python
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Ninebrains: SHA-pinned (release.yml and e2e.yml build through this action).
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: 10.28.2

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'
        cache: pnpm

    - if: inputs.setup-python == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install Python build tools
      if: inputs.setup-python == 'true'
      shell: bash
      run: python -m pip install --upgrade pip setuptools wheel

    - name: Install dependencies (Windows)
      if: inputs.windows-native == 'true'
      shell: bash
      env:
        npm_config_msvs_version: '2022'
        GYP_MSVS_VERSION: '2022'
      run: pnpm install --frozen-lockfile

    - name: Install dependencies
      if: inputs.windows-native != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Write production env
      shell: bash
      env:
        BUILD_VARIANT: ${{ inputs.build-variant }}
      run: |
        echo "VITE_BUILD=$BUILD_VARIANT" >> apps/emdash-desktop/.env.production
